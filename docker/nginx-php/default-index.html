<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Web Hosting by Waifly</title>
<style>
  :root {
    --dark-bg: #0B1E3D;
    --panel-bg: #0f2647;
    --accent: #38b1ed;
    --accent-rgb: 56, 177, 237;
    --text: #f1f5fb;
    --text-dim: #8ea3c4;
  }
  * { box-sizing: border-box; }
  html, body {
    height: 100%;
    margin: 0;
  }
  body {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 24px;
    background:
      radial-gradient(60% 50% at 50% 0%, rgba(var(--accent-rgb), 0.16), transparent 65%),
      var(--dark-bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    text-align: center;
  }
  .card {
    width: 100%;
    max-width: 460px;
    padding: 44px 36px 36px;
    background: linear-gradient(165deg, rgba(255,255,255,0.05), rgba(255,255,255,0.015));
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    box-shadow: 0 30px 80px -30px rgba(0,0,0,0.6);
  }
  .logo {
    width: 64px;
    height: 64px;
    margin: 0 auto 20px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    background: radial-gradient(circle at 35% 30%, rgba(var(--accent-rgb), 0.45), rgba(var(--accent-rgb), 0.12));
    box-shadow: 0 0 0 1px rgba(var(--accent-rgb), 0.3), 0 0 28px -6px rgba(var(--accent-rgb), 0.7);
  }
  .logo img {
    width: 40px;
    height: 40px;
    display: block;
  }
  .brand {
    font-size: 13px;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 14px;
  }
  h1 {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 12px;
    line-height: 1.3;
  }
  p {
    font-size: 0.95rem;
    line-height: 1.55;
    color: var(--text-dim);
    margin: 0 0 8px;
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-top: 22px;
    padding: 7px 14px;
    border-radius: 999px;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.08);
    font-size: 0.8rem;
    color: var(--text-dim);
  }
  .status .dot {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #34d399;
    box-shadow: 0 0 8px 1px rgba(52, 211, 153, 0.7);
  }
  footer {
    margin-top: 22px;
    font-size: 0.78rem;
    color: var(--text-dim);
  }
  footer a {
    color: var(--accent);
    text-decoration: none;
  }
  footer a:hover {
    text-decoration: underline;
  }
</style>
</head>
